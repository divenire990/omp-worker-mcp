name: Publish Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact 40-char commit SHA on master that passed the CI workflow"
        required: true
        type: string
      ci_run_id:
        description: "Completed CI workflow run ID for head_sha (optional; auto-resolved if omitted)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish-master
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify CI & Version Release Gate
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
       github.repository == 'divenire990/omp-worker-mcp' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == 'divenire990/omp-worker-mcp' &&
       github.event.workflow_run.head_repository.fork == false &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       github.repository == 'divenire990/omp-worker-mcp' &&
       github.ref == 'refs/heads/master')
    permissions:
      contents: read
      actions: read
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
      npm_already_published: ${{ steps.gate.outputs.npm_already_published }}
      decision_reason: ${{ steps.gate.outputs.decision_reason }}
      version: ${{ steps.gate.outputs.version }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      ci_run_id: ${{ steps.context.outputs.ci_run_id }}
      artifact_name: ${{ steps.context.outputs.artifact_name }}
      tarball_sha256: ${{ steps.gate.outputs.tarball_sha256 }}
    steps:
      - name: Checkout exact tested commit SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve and verify trusted CI run & 3-OS quality gates
        id: context
        run: node scripts/check-release.mjs --mode=resolve-context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_HEAD_SHA: ${{ inputs.head_sha }}
          RELEASE_CI_RUN_ID: ${{ inputs.ci_run_id }}

      - name: Download verified release artifact from matching CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.context.outputs.artifact_name }}
          path: .release-artifact
          run-id: ${{ steps.context.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate version alignment, artifact integrity, and npm state
        id: gate
        run: >-
          node scripts/check-release.mjs
          --mode=gate
          --artifact-dir=.release-artifact
          --head-sha="${{ steps.context.outputs.head_sha }}"
          --ci-run-id="${{ steps.context.outputs.ci_run_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm, Official MCP Registry & GitHub Release
    needs: [release-gate]
    if: needs.release-gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout exact verified commit SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-gate.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download verified release artifact from matching CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release-gate.outputs.artifact_name }}
          path: .release-artifact
          run-id: ${{ needs.release-gate.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity for annotated release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Execute ordered release (npm -> verify npm -> MCP Registry v1.8.2 -> GitHub Release)
        run: >-
          node scripts/publish-release.mjs
          --artifact-dir=.release-artifact
          --head-sha="${{ needs.release-gate.outputs.head_sha }}"
          --ci-run-id="${{ needs.release-gate.outputs.ci_run_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_HEAD_SHA: ${{ needs.release-gate.outputs.head_sha }}
          RELEASE_CI_RUN_ID: ${{ needs.release-gate.outputs.ci_run_id }}
