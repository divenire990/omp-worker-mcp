name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node.js 22 Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and build
        run: npm test

      - name: Run repeated low-level and fast-completion regression tests
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Repeat run $i/5 ==="
            node --test tests/runner.test.mjs tests/mcp.test.mjs
          done

      - name: Verify package bundle
        run: npm pack --dry-run
