name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node.js 22 Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and build
        run: npm test

      - name: Run repeated low-level and fast-completion regression tests
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Repeat run $i/5 ==="
            node --test tests/runner.test.mjs tests/mcp.test.mjs
          done

      - name: Verify package bundle
        run: npm pack --dry-run

      - name: Validate release metadata parity
        run: node scripts/check-release.mjs --offline

  package-artifact:
    name: Build Verified Release Bundle
    needs: [build-and-test]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'divenire990/omp-worker-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci

      - name: Build and pack release artifact with manifest
        run: node scripts/check-release.mjs --mode=pack-artifact --output-dir=.release-artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload verified release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ github.sha }}
          path: .release-artifact/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
